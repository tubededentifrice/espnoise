[project]
name = "espnoise-tools"
version = "0.1.0"
description = "Python development tools for ESPNoise"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opendle-electronics[platformio]",
]

[tool.uv.sources]
opendle-electronics = { git = "https://github.com/opendle/opendle-electronics.git", rev = "c6f0cffbacd849c63dcb7720d608c20e2c2a6269" }

[tool.uv]
package = false
exclude-newer = "2 weeks"
required-version = ">=0.12.0"

[tool.opendle.dependencies]
trusted-github = [
  "opendle/opendle-electronics",
  "opendle/opendle-esp32",
]

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; font-size: 17px; }
    path { fill: none; }
    .title { font-size: 30px; font-weight: 700; }
    .section { font-size: 21px; font-weight: 700; fill: #164e63; }
    .small { font-size: 14px; }
    .net { font-size: 14px; font-weight: 700; fill: #7c2d12; }
    .part { fill: #fff; stroke: #172033; stroke-width: 2; }
    .wire { fill: none; stroke: #172033; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .power { fill: none; stroke: #b42318; }
    .signal { fill: none; stroke: #075985; }
    .ground { fill: none; stroke: #111827; }
    .terminal { fill: #fef3c7; stroke: #172033; stroke-width: 2; }
    .note { fill: #f0f9ff; stroke: #0e7490; stroke-width: 1.5; }
  </style>
  <rect width="1200" height="850" fill="#fafafa"/>
  <text x="40" y="48" class="title">ESPNoise Rev C CNC electrical schematic</text>
  <text x="40" y="76" class="small">Direct wire terminals. No link wires. No LED logic-level IC.</text>

  <text x="40" y="118" class="section">5 V power and mute control</text>
  <rect x="40" y="140" width="110" height="70" rx="8" class="part"/>
  <text x="95" y="169" text-anchor="middle">P1</text><text x="95" y="193" text-anchor="middle" class="small">5 V power input</text>
  <circle cx="150" cy="158" r="6" class="terminal"/><circle cx="150" cy="192" r="6" class="terminal"/>
  <text x="158" y="151" class="small">1 +5V</text><text x="158" y="207" class="small">2 GND</text>
  <path d="M150 158 H265" class="wire power"/><text x="190" y="149" class="net">+5V_IN</text>
  <rect x="265" y="140" width="100" height="36" rx="6" class="part"/><text x="315" y="164" text-anchor="middle">F1 0.5 A PTC</text>
  <path d="M365 158 H585" class="wire power"/><text x="410" y="149" class="net">+5V_PERIPH</text>
  <circle cx="210" cy="158" r="4" fill="#b42318"/><path d="M210 158 V215" class="wire power"/>
  <rect x="165" y="215" width="90" height="38" rx="6" class="terminal"/><text x="210" y="240" text-anchor="middle">W1 ESP +5V</text>
  <circle cx="465" cy="158" r="4" fill="#b42318"/><path d="M465 158 V207" class="wire power"/>
  <rect x="410" y="207" width="110" height="38" rx="6" class="terminal"/><text x="465" y="232" text-anchor="middle">W10 LED +5V</text>
  <circle cx="550" cy="158" r="4" fill="#b42318"/><path d="M550 158 V230" class="wire power"/>
  <rect x="530" y="230" width="40" height="65" rx="5" class="part"/><text x="550" y="258" text-anchor="middle">C2</text><text x="550" y="278" text-anchor="middle" class="small">1000 uF</text>
  <path d="M550 295 V315 M530 315 H570 M537 323 H563 M544 331 H556" class="wire ground"/>
  <path d="M150 192 H325 V315" fill="none" class="wire ground"/>
  <rect x="270" y="214" width="110" height="38" rx="6" class="terminal"/><text x="325" y="239" text-anchor="middle">W2 ESP GND</text>
  <path d="M325 252 V315 M305 315 H345 M312 323 H338 M319 331 H331" fill="none" class="wire ground"/>

  <rect x="675" y="145" width="115" height="38" rx="6" class="terminal"/><text x="732" y="170" text-anchor="middle">W3 ESP MUTE</text>
  <path d="M790 164 H845" class="wire signal"/><circle cx="860" cy="164" r="5" fill="#172033"/><circle cx="900" cy="164" r="5" fill="#172033"/>
  <path d="M865 154 L895 174" class="wire"/><text x="880" y="142" text-anchor="middle">SW1 MUTE</text>
  <path d="M900 164 H950 V205 M930 205 H970 M937 213 H963 M944 221 H956" fill="none" class="wire ground"/><text x="805" y="196" class="net">MUTE_N</text>

  <text x="40" y="374" class="section">INMP441 microphone</text>
  <rect x="420" y="350" width="250" height="150" rx="10" class="part"/>
  <text x="545" y="382" text-anchor="middle">MIC1 INMP441 module</text><text x="545" y="407" text-anchor="middle" class="small">Confirm the printed pin labels.</text>
  <circle cx="420" cy="430" r="5" fill="#172033"/><text x="435" y="435" class="small">1 SCK</text>
  <circle cx="420" cy="462" r="5" fill="#172033"/><text x="435" y="467" class="small">2 WS</text>
  <circle cx="545" cy="500" r="5" fill="#172033"/><text x="455" y="520" class="small">3 L/R</text>
  <circle cx="670" cy="430" r="5" fill="#172033"/><text x="610" y="421" class="small">4 SD</text>
  <circle cx="670" cy="462" r="5" fill="#172033"/><text x="610" y="485" class="small">5 VDD</text>
  <circle cx="610" cy="500" r="5" fill="#172033"/><text x="620" y="520" class="small">6 GND</text>
  <rect x="40" y="412" width="130" height="34" rx="6" class="terminal"/><text x="105" y="435" text-anchor="middle">W4 ESP SCK</text>
  <rect x="40" y="454" width="130" height="34" rx="6" class="terminal"/><text x="105" y="477" text-anchor="middle">W5 ESP WS</text>
  <rect x="760" y="412" width="130" height="34" rx="6" class="terminal"/><text x="825" y="435" text-anchor="middle">W6 ESP SD</text>
  <rect x="760" y="454" width="130" height="34" rx="6" class="terminal"/><text x="825" y="477" text-anchor="middle">W7 ESP 3V3</text>
  <path d="M170 429 H420 M170 471 H350 V462 H420" fill="none" class="wire signal"/><path d="M670 430 H760 M670 462 H760" fill="none" class="wire signal"/>
  <path d="M545 500 V525 H610 V500 M578 525 V540 M558 540 H598 M565 548 H591 M572 556 H584" fill="none" class="wire ground"/>

  <text x="40" y="604" class="section">LED data for 10 to 12 SK6812 RGBW pixels</text>
  <rect x="40" y="625" width="155" height="38" rx="6" class="terminal"/><text x="117" y="650" text-anchor="middle">W8 ESP LED DATA</text>
  <path d="M195 644 H300" class="wire signal"/><rect x="300" y="626" width="120" height="36" rx="6" class="part"/><text x="360" y="650" text-anchor="middle">R1 330 ohm</text>
  <path d="M420 644 H530" class="wire signal"/><rect x="530" y="625" width="125" height="38" rx="6" class="terminal"/><text x="592" y="650" text-anchor="middle">W11 LED DATA</text>
  <rect x="690" y="625" width="125" height="38" rx="6" class="terminal"/><text x="752" y="650" text-anchor="middle">W12 LED GND</text>
  <path d="M752 663 V684 M732 684 H772 M739 692 H765 M746 700 H758" class="wire ground"/>
  <text x="205" y="635" class="net">LED_DATA_3V3</text><text x="440" y="635" class="net">LED_DATA</text>

  <text x="40" y="748" class="section">Hard-switched magnetic buzzer driver</text>
  <path d="M40 825 H110" class="wire power"/><text x="40" y="814" class="net">+5V_PERIPH</text>
  <rect x="110" y="805" width="100" height="40" rx="6" class="part"/><text x="160" y="831" text-anchor="middle">SW2 HARD</text>
  <path d="M210 825 H275" class="wire power"/><text x="218" y="814" class="net">+5V_BUZZER_SW</text>
  <rect x="275" y="795" width="105" height="60" rx="8" class="part"/><text x="327" y="822" text-anchor="middle">BZ1 5 V</text><text x="327" y="843" text-anchor="middle" class="small">magnetic</text>
  <path d="M380 825 H500" class="wire"/><circle cx="455" cy="825" r="4" fill="#172033"/>
  <path d="M275 825 V770 H455 V825" fill="none" class="wire"/><rect x="335" y="752" width="85" height="36" rx="5" class="part"/><text x="377" y="776" text-anchor="middle" class="small">D1 1N5819</text><text x="286" y="764" class="small">K</text>
  <rect x="500" y="790" width="100" height="90" rx="8" class="part"/><text x="550" y="821" text-anchor="middle">Q1</text><text x="550" y="844" text-anchor="middle" class="small">2N3904</text><text x="550" y="864" text-anchor="middle" class="small">E-B-C</text>
  <path d="M550 880 V915 M530 915 H570 M537 923 H563 M544 931 H556" class="wire ground"/>
  <rect x="785" y="832" width="145" height="38" rx="6" class="terminal"/><text x="857" y="857" text-anchor="middle">W9 ESP BUZZER</text>
  <path d="M785 851 H710" class="wire signal"/><rect x="650" y="833" width="60" height="36" rx="5" class="part"/><text x="680" y="857" text-anchor="middle" class="small">R2 1K</text>
  <path d="M650 851 H600" class="wire signal"/><circle cx="630" cy="851" r="4" fill="#172033"/>
  <path d="M630 851 V895" class="wire"/><rect x="592" y="895" width="76" height="34" rx="5" class="part"/><text x="630" y="918" text-anchor="middle" class="small">R3 100K</text>
  <path d="M630 929 V947 M610 947 H650 M617 955 H643 M624 963 H636" class="wire ground"/>
  <rect x="885" y="730" width="275" height="112" rx="8" class="note"/>
  <text x="905" y="757" class="small">Assembly rules:</text><text x="905" y="780" class="small">SW2 stays in the buzzer power wire.</text>
  <text x="905" y="803" class="small">D1 cathode K goes to switched +5 V.</text><text x="905" y="826" class="small">Check Q1 pin order before solder.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; font-size: 18px; }
    .title { font-size: 32px; font-weight: 700; }
    .section { font-size: 23px; font-weight: 700; fill: #155e75; }
    .small { font-size: 14px; }
    .pin { font-size: 15px; font-weight: 700; }
    .net { font-size: 14px; font-weight: 700; fill: #9a3412; }
    .box { fill: #fff; stroke: #172033; stroke-width: 2; }
    .connector { fill: #fef3c7; stroke: #172033; stroke-width: 2; }
    .note { fill: #ecfeff; stroke: #0e7490; stroke-width: 1.5; }
    .wire { stroke: #172033; stroke-width: 3; fill: none; }
    .signal { stroke: #0369a1; }
    .power { stroke: #b42318; }
    .node { fill: #172033; }
  </style>
  <rect width="1600" height="1180" fill="#fafafa"/>
  <text x="40" y="52" class="title">ESPNoise Rev C CNC schematic and pin map</text>
  <text x="40" y="82" class="small">All views use the marked part face. MIC1 and BZ1 dimensions are provisional until measured.</text>

  <text x="40" y="125" class="section">Power and external wire pads</text>
  <rect x="40" y="150" width="150" height="90" rx="8" class="connector"/>
  <text x="115" y="178" text-anchor="middle">PWR1</text>
  <text x="55" y="207" class="pin">1 +5V IN</text><text x="55" y="231" class="pin">2 GND</text>
  <line x1="190" y1="200" x2="300" y2="200" class="wire power"/>
  <text x="205" y="190" class="net">+5V_IN</text>
  <rect x="300" y="180" width="130" height="40" rx="6" class="box"/>
  <text x="365" y="206" text-anchor="middle">F1 0.5 A PTC</text>
  <line x1="430" y1="200" x2="730" y2="200" class="wire power"/>
  <text x="465" y="190" class="net">+5V_PERIPH</text>
  <circle cx="250" cy="200" r="5" class="node"/><line x1="250" y1="200" x2="250" y2="265" class="wire power"/>
  <rect x="175" y="265" width="150" height="42" rx="6" class="connector"/>
  <text x="250" y="292" text-anchor="middle">J_ESP32-1 VIN/5V</text>
  <line x1="190" y1="224" x2="390" y2="224" class="wire"/><line x1="390" y1="224" x2="390" y2="265" class="wire"/>
  <rect x="330" y="265" width="120" height="42" rx="6" class="connector"/>
  <text x="390" y="292" text-anchor="middle">J_ESP32-2 GND</text>
  <line x1="390" y1="307" x2="390" y2="330" class="wire"/><line x1="370" y1="330" x2="410" y2="330" class="wire"/><line x1="378" y1="339" x2="402" y2="339" class="wire"/>

  <text x="820" y="125" class="section">J_ESP32 wire group</text>
  <rect x="820" y="145" width="730" height="165" rx="8" class="connector"/>
  <text x="845" y="176" class="pin">1 VIN/5V → +5V_IN</text>
  <text x="845" y="205" class="pin">2 GND → common GND</text>
  <text x="845" y="234" class="pin">3 3V3 → MIC1-2 VDD</text>
  <text x="845" y="263" class="pin">4 GPIO26 → MIC1-6 SCK</text>
  <text x="845" y="292" class="pin">5 GPIO25 → MIC1-5 WS</text>
  <text x="1190" y="176" class="pin">6 GPIO32 ← MIC1-3 SD</text>
  <text x="1190" y="205" class="pin">7 GPIO18 → J_LED-2 DIN</text>
  <text x="1190" y="234" class="pin">8 GPIO23 → R2 / buzzer driver</text>
  <text x="1190" y="263" class="pin">9 GPIO27 → SW1 mute</text>
  <text x="1190" y="292" class="small">Individual solder wires, not one plug housing.</text>

  <text x="40" y="355" class="section">MIC1: MH-ET LIVE INMP441, label-side view, notch at top</text>
  <rect x="440" y="370" width="420" height="255" rx="16" class="box"/>
  <text x="650" y="401" text-anchor="middle">MIC1 ROUND 2 × 3 MODULE</text>
  <text x="650" y="426" text-anchor="middle" class="small">The module contains its local support parts.</text>
  <circle cx="540" cy="475" r="17" class="connector"/><text x="540" y="481" text-anchor="middle" class="pin">1</text>
  <circle cx="650" cy="475" r="17" class="connector"/><text x="650" y="481" text-anchor="middle" class="pin">2</text>
  <circle cx="760" cy="475" r="17" class="connector"/><text x="760" y="481" text-anchor="middle" class="pin">3</text>
  <circle cx="540" cy="560" r="17" class="connector"/><text x="540" y="566" text-anchor="middle" class="pin">4</text>
  <circle cx="650" cy="560" r="17" class="connector"/><text x="650" y="566" text-anchor="middle" class="pin">5</text>
  <circle cx="760" cy="560" r="17" class="connector"/><text x="760" y="566" text-anchor="middle" class="pin">6</text>
  <text x="540" y="452" text-anchor="middle" class="pin">GND</text><text x="650" y="452" text-anchor="middle" class="pin">VDD</text><text x="760" y="452" text-anchor="middle" class="pin">SD</text>
  <text x="540" y="596" text-anchor="middle" class="pin">L/R</text><text x="650" y="596" text-anchor="middle" class="pin">WS</text><text x="760" y="596" text-anchor="middle" class="pin">SCK</text>
  <line x1="540" y1="577" x2="540" y2="615" class="wire"/><line x1="520" y1="615" x2="560" y2="615" class="wire"/>
  <line x1="540" y1="458" x2="540" y2="435" class="wire"/><line x1="520" y1="435" x2="560" y2="435" class="wire"/>
  <line x1="650" y1="458" x2="650" y2="425" class="wire signal"/><text x="670" y="442" class="net">J_ESP32-3 3V3</text>
  <line x1="777" y1="475" x2="940" y2="475" class="wire signal"/><text x="800" y="466" class="net">J_ESP32-6 GPIO32</text>
  <line x1="667" y1="560" x2="940" y2="560" class="wire signal"/><text x="700" y="551" class="net">J_ESP32-5 GPIO25</text>
  <line x1="777" y1="590" x2="940" y2="590" class="wire signal"/><text x="800" y="581" class="net">J_ESP32-4 GPIO26</text>
  <rect x="990" y="400" width="510" height="180" rx="8" class="note"/>
  <text x="1015" y="432">Required orientation and checks</text>
  <text x="1015" y="462" class="small">Top row: 1 GND, 2 VDD, 3 SD</text>
  <text x="1015" y="489" class="small">Bottom row: 4 L/R, 5 WS, 6 SCK</text>
  <text x="1015" y="516" class="small">MIC1-4 L/R connects to GND.</text>
  <text x="1015" y="543" class="small">Align the measured acoustic hole, not the round body center.</text>

  <text x="40" y="690" class="section">LED and mute connections</text>
  <rect x="40" y="720" width="440" height="145" rx="8" class="connector"/>
  <text x="65" y="753">J_LED individual wires</text>
  <text x="65" y="786" class="pin">1 +5V ← +5V_PERIPH after F1</text>
  <text x="65" y="817" class="pin">2 DIN ← J_ESP32-7 GPIO18, direct trace</text>
  <text x="65" y="848" class="pin">3 GND → common GND</text>
  <rect x="545" y="735" width="185" height="45" rx="6" class="connector"/><text x="637" y="764" text-anchor="middle">J_ESP32-9 GPIO27</text>
  <line x1="730" y1="758" x2="800" y2="758" class="wire signal"/>
  <circle cx="815" cy="758" r="6" class="node"/><circle cx="875" cy="758" r="6" class="node"/>
  <line x1="822" y1="744" x2="868" y2="772" class="wire"/><text x="845" y="727" text-anchor="middle">SW1 MUTE</text>
  <text x="815" y="791" text-anchor="middle" class="small">pad 5</text><text x="875" y="791" text-anchor="middle" class="small">pad 6</text>
  <line x1="875" y1="758" x2="940" y2="758" class="wire"/><line x1="940" y1="758" x2="940" y2="805" class="wire"/><line x1="920" y1="805" x2="960" y2="805" class="wire"/><line x1="928" y1="814" x2="952" y2="814" class="wire"/>

  <text x="40" y="925" class="section">Two-pin buzzer and protected GPIO23 driver</text>
  <line x1="40" y1="1040" x2="130" y2="1040" class="wire power"/><text x="40" y="1029" class="net">+5V_PERIPH</text>
  <rect x="130" y="1018" width="130" height="44" rx="6" class="box"/><text x="195" y="1046" text-anchor="middle">SW2 pads 5→4</text>
  <line x1="260" y1="1040" x2="340" y2="1040" class="wire power"/>
  <rect x="340" y="1000" width="150" height="80" rx="8" class="box"/><text x="415" y="1030" text-anchor="middle">BZ1</text><text x="415" y="1055" text-anchor="middle" class="small">1 +     2 −</text>
  <line x1="490" y1="1040" x2="610" y2="1040" class="wire"/><circle cx="560" cy="1040" r="5" class="node"/>
  <line x1="340" y1="1040" x2="340" y2="970" class="wire"/><line x1="340" y1="970" x2="560" y2="970" class="wire"/><line x1="560" y1="970" x2="560" y2="1040" class="wire"/>
  <rect x="405" y="950" width="100" height="40" rx="5" class="box"/><text x="455" y="976" text-anchor="middle">D1 1N5819</text><text x="352" y="963" class="small">K cathode</text>
  <rect x="610" y="1000" width="120" height="80" rx="8" class="box"/><text x="670" y="1031" text-anchor="middle">Q1 2N3904</text><text x="670" y="1056" text-anchor="middle" class="small">collector / emitter</text>
  <line x1="670" y1="1080" x2="670" y2="1100" class="wire"/><line x1="650" y1="1100" x2="690" y2="1100" class="wire"/><line x1="658" y1="1109" x2="682" y2="1109" class="wire"/>
  <rect x="1060" y="1010" width="205" height="45" rx="6" class="connector"/><text x="1162" y="1039" text-anchor="middle">J_ESP32-8 GPIO23</text>
  <line x1="1060" y1="1033" x2="965" y2="1033" class="wire signal"/><rect x="865" y="1013" width="100" height="40" rx="6" class="box"/><text x="915" y="1039" text-anchor="middle">R2 1 kohm</text>
  <line x1="865" y1="1033" x2="730" y2="1033" class="wire signal"/><circle cx="800" cy="1033" r="5" class="node"/>
  <line x1="800" y1="1033" x2="800" y2="1080" class="wire"/><rect x="760" y="1080" width="80" height="34" rx="5" class="box"/><text x="800" y="1103" text-anchor="middle" class="small">R3 100k</text>
  <line x1="800" y1="1114" x2="800" y2="1140" class="wire"/><line x1="780" y1="1140" x2="820" y2="1140" class="wire"/><line x1="788" y1="1149" x2="812" y2="1149" class="wire"/>
  <rect x="1295" y="965" width="265" height="125" rx="8" class="note"/>
  <text x="1315" y="995" class="small">R2 limits GPIO/base current.</text>
  <text x="1315" y="1021" class="small">R3 prevents a reset chirp.</text>
  <text x="1315" y="1047" class="small">D1 protects an inductive buzzer.</text>
  <text x="1315" y="1073" class="small">Do not drive BZ1 from GPIO23.</text>
</svg>

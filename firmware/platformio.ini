[platformio]
default_envs = esp32dev

[env]
platform = platformio/espressif32@6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
platform_packages =
  ${pinned_esp32_packages.platform_packages}
build_src_filter =
  +<*>
  -<calibration_main.cpp>
  -<calibration_session.cpp>
lib_deps =
  adafruit/Adafruit NeoPixel@1.12.3
  h2zero/NimBLE-Arduino@1.4.3
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=16
  -DCONFIG_BT_NIMBLE_MAX_CCCDS=16
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:esp32dev]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DESPNOISE_LED_BRIGHTNESS=255
  -DESPNOISE_PRODUCTION_STARTUP_CHECK=1

[env:esp32dev_led_test]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DESPNOISE_LED_STARTUP_TEST=1

[env:esp32dev_fast_test]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DESPNOISE_LED_STARTUP_TEST=1
  -DESPNOISE_BUZZER_MELODY_TEST=1
  -DESPNOISE_SAMPLE_DURATION_MS=3000UL
  -DESPNOISE_SAMPLE_PERIOD_MS=5000UL
  -DESPNOISE_DECISION_WINDOW_MS=15000UL
  -DESPNOISE_TRIGGER_SAMPLE_PERCENT=50
  -DESPNOISE_LED_BRIGHTNESS=255

[env:esp32dev_calibration]
board = esp32dev
build_src_filter =
  +<audio_input.cpp>
  +<alarm_output.cpp>
  +<calibration_main.cpp>
  +<calibration_session.cpp>

[env:lolin32_lite]
board = lolin32_lite
build_flags =
  ${env.build_flags}
  -DESPNOISE_SWITCHED_PERIPHERAL_POWER=1

[env:native]
platform = platformio/native@1.2.1
framework =
platform_packages =
  platformio/tool-scons@4.40801.0
lib_deps =
build_flags =
  -std=gnu++17
build_src_filter =
  +<config_packet.cpp>
  +<device_name.cpp>
  +<mute_state.cpp>
  +<noise_detector.cpp>
  +<noise_analytics.cpp>
  +<status_packet.cpp>
test_framework = unity
test_build_src = yes

[pinned_esp32_packages]
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  platformio/tool-esptoolpy@1.40501.0
  platformio/tool-mkfatfs@2.0.1
  platformio/tool-mklittlefs@1.203.210628
  platformio/tool-mkspiffs@2.230.0
  platformio/tool-openocd-esp32@2.1100.20220706
  platformio/tool-scons@4.40801.0
  platformio/toolchain-esp32ulp@1.23800.240113
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5

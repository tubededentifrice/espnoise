[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter =
  +<*>
  -<calibration_main.cpp>
  -<calibration_session.cpp>
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  h2zero/NimBLE-Arduino@1.4.3
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=16
  -DCONFIG_BT_NIMBLE_MAX_CCCDS=16
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:esp32dev]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DESPNOISE_LED_BRIGHTNESS=255
  -DESPNOISE_PRODUCTION_STARTUP_CHECK=1

[env:esp32dev_led_test]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DESPNOISE_LED_STARTUP_TEST=1

[env:esp32dev_fast_test]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DESPNOISE_LED_STARTUP_TEST=1
  -DESPNOISE_BUZZER_MELODY_TEST=1
  -DESPNOISE_SAMPLE_DURATION_MS=3000UL
  -DESPNOISE_SAMPLE_PERIOD_MS=5000UL
  -DESPNOISE_DECISION_WINDOW_MS=15000UL
  -DESPNOISE_TRIGGER_SAMPLE_PERCENT=50
  -DESPNOISE_LED_BRIGHTNESS=255

[env:esp32dev_calibration]
board = esp32dev
build_src_filter =
  +<audio_input.cpp>
  +<alarm_output.cpp>
  +<calibration_main.cpp>
  +<calibration_session.cpp>

[env:lolin32_lite]
board = lolin32_lite
build_flags =
  ${env.build_flags}
  -DESPNOISE_SWITCHED_PERIPHERAL_POWER=1

[env:native]
platform = native
framework =
lib_deps =
build_flags =
  -std=gnu++17
build_src_filter =
  +<config_packet.cpp>
  +<device_name.cpp>
  +<mute_state.cpp>
  +<noise_detector.cpp>
  +<status_packet.cpp>
test_framework = unity
test_build_src = yes
